# Render Blueprint — API SKAIHUB untuk DEMO (paket free). Panduan: docs/DEPLOY-DEMO.md
# Spesifikasi: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: skaihub-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: dojang-hub-api
    # Path Docker relatif terhadap root repo (bukan rootDir).
    dockerfilePath: ./dojang-hub-api/Dockerfile
    dockerContext: ./dojang-hub-api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Rahasia: diisi saat membuat Blueprint (Render meminta nilainya sekali) ---
      - key: APP_KEY
        sync: false # hasil `php artisan key:generate --show` (diawali base64:)
      - key: DB_URL
        sync: false # Neon pooled: postgresql://USER:PASS@ep-xxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: CORS_ALLOWED_ORIGINS
        sync: false # URL Vercel, mis. https://skaihub-demo.vercel.app (tanpa garis miring akhir)
      - key: FRONTEND_URL
        sync: false # sama dengan URL Vercel

      # --- Nilai tetap (bukan rahasia) ---
      - key: APP_NAME
        value: SKAIHUB
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: en
      # APP_URL sengaja tidak di-set: entrypoint memakai RENDER_EXTERNAL_URL (https://<nama>.onrender.com).
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SANCTUM_EXPIRATION
        value: "10080"
      # Tanpa Redis & tanpa worker di paket free:
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: BCRYPT_ROUNDS
        value: "12"
      # Upload: "public" = disk lokal kontainer (HILANG saat redeploy/spin-down di paket free).
      # Ganti ke "s3" + isi AWS_* di bawah untuk Cloudflare R2.
      - key: FILESYSTEM_UPLOAD_DISK
        value: public

      # --- Opsional, tambahkan manual di tab Environment bila dipakai ---
      # SEED_ON_BOOT=true              -> isi data demo sekali saat boot, lalu HAPUS variabel ini
      # DB_MIGRATION_URL=<Neon direct> -> koneksi tanpa "-pooler" khusus untuk migrasi
      # SANCTUM_STATEFUL_DOMAINS=      -> tidak dibutuhkan (API memakai token Bearer)
      # Cloudflare R2 (FILESYSTEM_UPLOAD_DISK=s3):
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_BUCKET,
      # AWS_DEFAULT_REGION=auto, AWS_ENDPOINT=https://<ACCOUNT_ID>.r2.cloudflarestorage.com,
      # AWS_URL=https://pub-<hash>.r2.dev (URL publik bucket), AWS_USE_PATH_STYLE_ENDPOINT=true
